    const App = () => {
      const [currentKey, setCurrentKey] = useState('시작');
      const [history, setHistory] = useState([]); // history items will now be objects: { id: string, tasks: string[] }
      const [selectedTasks, setSelectedTasks] = useState([]);
      const [viewMode, setViewMode] = useState('USER');
      const [isAdmin, setIsAdmin] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [editingId, setEditingId] = useState(null);
      const [saveStatus, setSaveStatus] = useState("");
      const [steps, setSteps] = useState(DEFAULT_STEPS);
      const [isDataLoaded, setIsDataLoaded] = useState(false);
      const [popupImage, setPopupImage] = useState(null);

      // ====== Google Drive에서 데이터 로드 ======
      useEffect(() => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((serverData) => {
              if (serverData) {
                try {
                  const parsedData = JSON.parse(serverData);
                  setSteps(parsedData);
                } catch (e) { console.error("데이터 파싱 실패", e); }
              }
              setIsDataLoaded(true);
            })
            .withFailureHandler((err) => {
              console.error("데이터 로드 실패", err);
              setIsDataLoaded(true);
            })
            .loadStoredData();
        } else {
          setIsDataLoaded(true);
        }
      }, []);
      
      const currentStep = useMemo(() => steps.find(s => s.id === currentKey) || steps[0], [steps, currentKey]);
      const editingStep = useMemo(() => steps.find(s => s.id === editingId), [steps, editingId]);

      // ... (기존 테마 설정 및 로그인 로직 유지) ...
      const themeConfig = {
        blue: { bg: 'bg-blue-600', light: 'bg-blue-50', text: 'text-blue-600', border: 'border-blue-400', hex: '#2563eb', gradient: 'from-blue-600 to-blue-800' },
        emerald: { bg: 'bg-emerald-600', light: 'bg-emerald-50', text: 'text-emerald-600', border: 'border-emerald-400', hex: '#10b981', gradient: 'from-emerald-600 to-emerald-800' },
        orange: { bg: 'bg-orange-500', light: 'bg-orange-50', text: 'text-orange-600', border: 'border-orange-400', hex: '#f97316', gradient: 'from-orange-500 to-orange-700' },
        purple: { bg: 'bg-purple-600', light: 'bg-purple-50', text: 'text-purple-600', border: 'border-purple-400', hex: '#9333ea', gradient: 'from-purple-600 to-purple-800' },
      };

      const getTheme = (t) => themeConfig[t] || themeConfig.blue;

      const handleAdminToggle = () => { 
        if (isAdmin) setViewMode(viewMode === 'USER' ? 'ADMIN' : 'USER'); 
        else setShowLoginModal(true); 
      };
      
      const login = () => { 
        if (passwordInput === "hmm0424") { 
          setIsAdmin(true); 
          setViewMode('ADMIN'); 
          setShowLoginModal(false); 
          setPasswordInput(""); 
        } else alert("암호 오류"); 
      };

      // ====== 편집 기능들 ======
      const deleteStep = (stepId) => {
        if (stepId === '시작') { alert("시작 단계는 삭제할 수 없습니다."); return; }
        if (confirm(`"${steps.find(s => s.id === stepId)?.title}" 단계를 삭제하시겠습니까?`)) {
          setSteps(steps.filter(s => s.id !== stepId));
          if (editingId === stepId) setEditingId(null);
        }
      };

      // 단계 복제 함수 (추가됨)
      const duplicateStep = (stepId) => {
        const stepToClone = steps.find(s => s.id === stepId);
        if (!stepToClone) return;

        const newId = `step_${Date.now()}`;
        const newStep = JSON.parse(JSON.stringify(stepToClone)); // Deep copy
        newStep.id = newId;
        newStep.title = `${newStep.title} (복사본)`;
        
        // 서브 항목 ID도 새로 생성하여 충돌 방지
        if (newStep.subTasks) {
            newStep.subTasks = newStep.subTasks.map(st => ({
                ...st,
                id: `st_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`
            }));
        }

        const index = steps.findIndex(s => s.id === stepId);
        const newSteps = [...steps];
        newSteps.splice(index + 1, 0, newStep);
        setSteps(newSteps);
        setEditingId(newId);
      };

      // 순서 변경 함수
      const moveStep = (stepId, direction) => {
        if (stepId === '시작') return; 

        const index = steps.findIndex(s => s.id === stepId);
        if (index < 0) return;

        const newSteps = [...steps];
        if (direction === 'up' && index > 1) { 
           [newSteps[index], newSteps[index - 1]] = [newSteps[index - 1], newSteps[index]];
        } else if (direction === 'down' && index < newSteps.length - 1) {
           [newSteps[index], newSteps[index + 1]] = [newSteps[index + 1], newSteps[index]];
        }
        setSteps(newSteps);
      };

      const addNewStep = () => {
        const newId = `step_${Date.now()}`;
        const newStep = {
          id: newId,
          title: '새 단계',
          theme: 'blue',
          type: 'multi-select', 
          script: '<p>안내 내용을 입력하세요.</p>',
          options: [],
          subTasks: [
             { id: `st_${Date.now()}`, label: '새 항목', cases: '', docs: [], notes: '' }
          ]
        };
        setSteps([...steps, newStep]);
        setEditingId(newId);
      };

      const updateStep = (field, value) => setSteps(steps.map(s => s.id === editingId ? { ...s, [field]: value } : s));

      // subTask 관련 함수들
      const addSubTask = () => {
        const newSubTask = { id: `st_${Date.now()}`, label: '새 항목', docs: [], notes: '' };
        const currentSubTasks = editingStep?.subTasks || [];
        updateStep('subTasks', [...currentSubTasks, newSubTask]);
      };

      const updateSubTask = (taskId, field, value) => {
        const updatedSubTasks = (editingStep?.subTasks || []).map(st => st.id === taskId ? { ...st, [field]: value } : st);
        updateStep('subTasks', updatedSubTasks);
      };

      const deleteSubTask = (taskId) => {
        if (confirm("이 항목을 삭제하시겠습니까?")) {
          const updatedSubTasks = (editingStep?.subTasks || []).filter(st => st.id !== taskId);
          updateStep('subTasks', updatedSubTasks);
        }
      };

      // 서브 항목 순서 변경 함수 (추가됨)
      const moveSubTask = (taskId, direction) => {
          const subTasks = editingStep.subTasks || [];
          const index = subTasks.findIndex(t => t.id === taskId);
          if (index < 0) return;

          const newSubTasks = [...subTasks];
          if (direction === 'up' && index > 0) {
              [newSubTasks[index], newSubTasks[index - 1]] = [newSubTasks[index - 1], newSubTasks[index]];
          } else if (direction === 'down' && index < newSubTasks.length - 1) {
              [newSubTasks[index], newSubTasks[index + 1]] = [newSubTasks[index + 1], newSubTasks[index]];
          }
          updateStep('subTasks', newSubTasks);
      };

      const addDocToSubTask = (taskId) => {
        const task = (editingStep?.subTasks || []).find(st => st.id === taskId);
        if (task) updateSubTask(taskId, 'docs', [...task.docs, '새 서류']);
      };

      const updateDocInSubTask = (taskId, docIndex, value) => {
        const task = (editingStep?.subTasks || []).find(st => st.id === taskId);
        if (task) {
          const newDocs = [...task.docs];
          newDocs[docIndex] = value;
          updateSubTask(taskId, 'docs', newDocs);
        }
      };

      const deleteDocFromSubTask = (taskId, docIndex) => {
        const task = (editingStep?.subTasks || []).find(st => st.id === taskId);
        if (task) {
          const newDocs = task.docs.filter((_, idx) => idx !== docIndex);
          updateSubTask(taskId, 'docs', newDocs);
        }
      };

      // 옵션 관련 함수들
      const addOption = () => {
        const newOption = { label: '새 버튼', next: '시작', icon: 'chevronRight' };
        updateStep('options', [...(editingStep?.options || []), newOption]);
      };

      const updateOption = (index, field, value) => {
        let finalValue = value;
        if (field === 'addTasks') {
           finalValue = value ? value.split(',').map(v => v.trim()) : [];
        }

        const updatedOptions = (editingStep?.options || []).map((opt, idx) => 
          idx === index ? { ...opt, [field]: finalValue } : opt
        );
        updateStep('options', updatedOptions);
      };

      const deleteOption = (index) => {
        const updatedOptions = (editingStep?.options || []).filter((_, idx) => idx !== index);
        updateStep('options', updatedOptions);
      };

      // ====== 클라우드 저장 ======
      const saveToCloud = () => {
        const pw = prompt("저장을 위해 보안 암호를 입력하세요.");
        if (!pw) return;
        setSaveStatus("저장 중...");
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((result) => {
              if (result === "SUCCESS") setSaveStatus("저장 완료!");
              else { setSaveStatus("저장 실패"); alert("저장 실패"); }
              setTimeout(() => setSaveStatus(""), 2000);
            })
            .withFailureHandler((error) => {
              setSaveStatus("에러 발생");
              alert("저장 실패: " + error.message);
              setTimeout(() => setSaveStatus(""), 2000);
            })
            .saveStoredData(JSON.stringify(steps), pw);
        } else {
          if (pw === "hmm0424") {
            console.log("로컬 저장 시뮬레이션:", JSON.stringify(steps));
            setSaveStatus("로컬 저장 완료");
            setTimeout(() => setSaveStatus(""), 2000);
          } else { alert("암호 오류"); setSaveStatus(""); }
        }
      };

      // ====== 핵심 로직 변경 부분 (분기 & 추가 항목 & 상태 복구) ======
      const handleNext = (opt) => {
        if (opt.next === '시작') {
          setHistory([]);
          setSelectedTasks([]);
          setCurrentKey('시작');
          return;
        }

        // 1. 현재 상태 스냅샷 저장 (이동 전의 선택 항목 상태)
        const snapshot = {
          id: currentKey,
          tasks: [...selectedTasks]
        };

        // 2. 추가 항목 처리 (로컬 변수로 계산)
        let nextSelectedTasks = [...selectedTasks];
        if (opt.addTasks && opt.addTasks.length > 0) {
          opt.addTasks.forEach(taskId => {
            if (!nextSelectedTasks.includes(taskId)) nextSelectedTasks.push(taskId);
          });
          // 실제 상태 업데이트
          setSelectedTasks(nextSelectedTasks);
        }

        // 3. 분기 처리 및 이동
        if (currentStep.type === 'multi-select' && opt.next) {
          if (opt.next.includes('결과')) {
             if (selectedTasks.length === 0) {
                alert("변경 항목을 최소 하나 이상 선택해 주세요.");
                return;
             }
          }
          
          const branchTask = steps
            .flatMap(s => s.subTasks || [])
            // 주의: 분기 체크 시점의 사용자 선택은 selectedTasks 기준이 맞지만
            // addTasks로 인해 추가된 항목도 고려하려면 nextSelectedTasks를 사용해도 됨
            // 여기서는 사용자 선택 항목 기준(selectedTasks)이 안전함
            .find(t => t.branch && selectedTasks.includes(t.id));
            
          if (branchTask) {
             if (currentKey !== branchTask.branch) {
                setHistory([...history, snapshot]);
                setCurrentKey(branchTask.branch);
                return;
             }
          }
        }
        
        // 일반 이동

        setCurrentKey(prevState.id);

        if (prevState.tasks) {
          setSelectedTasks(prevState.tasks);
        }
      };
      
      const goHome = () => { 
        setHistory([]); 
        setSelectedTasks([]); 
        setCurrentKey('시작'); 
      };

      const toggleTask = (taskId) => {
        setSelectedTasks(prev => 
          prev.includes(taskId) 
            ? prev.filter(t => t !== taskId) 
            : [...prev, taskId]

      };

        const docs = new Set();
        const notes = [];
        const details = [];

            details.push(task);
            if (task.docs) task.docs.forEach(d => docs.add(d.trim()));
            if (task.notes && task.notes.trim()) notes.push({ label: task.label, note: task.notes });
          }
        });
        
        return { 
          finalDocs: Array.from(docs), 
          finalNotes: notes,
          selectedDetails: details
        };
      }, [selectedTasks, steps]);

                            <button onClick={(e) => { e.stopPropagation(); moveStep(s.id, 'down'); }} disabled={idx >= steps.length - 1} className={`p-1 rounded hover:bg-slate-200 ${idx >= steps.length - 1 ? 'opacity-30 cursor-not-allowed' : 'text-slate-500'}`}>

                                    <label className="text-xs flex items-center gap-1 cursor-pointer">
                                      <input type="checkbox" checked={task.isHidden || false} onChange={(e) => updateSubTask(task.id, 'isHidden', e.target.checked)} />

                                    </label>
                                    <button onClick={() => deleteSubTask(task.id)} className="text-red-400 hover:text-red-600 p-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                                  </div>
                                </div>
                                <div className="ml-8 mb-3">
                                  <span className="text-xs font-bold text-slate-500 block mb-2">💡 해당 케이스</span>

                                    {task.docs.map((doc, dIdx) => (
                                      <div key={dIdx} className="flex items-center gap-2">
                                        <input className="flex-1 p-2 bg-white border rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500" value={doc} onChange={(e) => updateDocInSubTask(task.id, dIdx, e.target.value)} />

                              <div className="flex-1">
                                <span className={`font-semibold text-sm block ${selectedTasks.includes(task.id) ? 'text-slate-800' : 'text-slate-600'}`}>{task.label}</span>
                                {task.cases && <span className={`text-xs block mt-1 ${selectedTasks.includes(task.id) ? 'text-slate-600' : 'text-slate-400'}`}>{task.cases}</span>}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Result */}
                    {currentStep.type === 'result' && (
                      <div className="space-y-6 mb-8">
                        {/* 필요 서류 안내 (순서 변경: 위로 이동) */}
                        <div className="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-6 md:p-8 rounded-3xl shadow-xl">
                          <div className="flex items-center gap-3 mb-6">
                            <div className="bg-orange-500 p-2.5 rounded-xl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div>
                            <div><p className="text-orange-400 text-xs font-bold uppercase tracking-wider">Required Documents</p><h3 className="text-xl font-bold">필요 서류 안내</h3></div>
                          </div>
                          {finalDocs.length > 0 ? (
                            <div className="space-y-3">
                              {finalDocs.map((doc, idx) => (
                                <div key={idx} className="result-item flex items-center gap-4 bg-white/10 backdrop-blur p-4 rounded-xl" style={{'--index': idx}}>
                                  <div className="bg-orange-500 w-8 h-8 rounded-lg flex items-center justify-center shrink-0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg></div>
                                  <span className="font-semibold text-base">{doc}</span>
                                </div>
                              ))}
                            </div>
                          ) : (
                            <div className="text-center py-8 text-white/60">
                              <svg className="mx-auto mb-3 opacity-50" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                              <p className="font-semibold">서류 불필요</p>
                              <p className="text-sm mt-1">선택하신 항목은 별도 서류 없이 처리 가능합니다.</p>
                            </div>
                          )}
                        </div>

                        {/* 추가 안내사항 */}
                        {finalNotes.length > 0 && (
                          <div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-5 md:p-6">
                            <div className="flex items-center gap-2 mb-4">
                              <svg className="text-amber-600" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                              <p className="font-bold text-amber-800">추가 안내사항</p>
                            </div>
                            <div className="space-y-3">
                              {finalNotes.map((item, idx) => (
                                <div key={idx} className="bg-white rounded-xl p-4 border border-amber-200">
                                  <p className="text-xs font-bold text-amber-600 mb-1">{item.label}</p>
                                  <div 
                                    className="text-sm text-amber-900 leading-relaxed" 
                                    dangerouslySetInnerHTML={{ __html: item.note }} 
                                    onClick={handleContentClick}
                                  />
                                </div>
                              ))}
                            </div>
                          </div>
                        )}

                        {/* 선택된 변경 항목 (순서 변경: 맨 아래로 이동) */}
                        <div className="bg-slate-100 rounded-2xl p-5">
                          <p className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">선택된 변경 항목</p>
                          <div className="flex flex-wrap gap-2">
                            {selectedDetails.map((task, idx) => (
                              <span key={idx} className="bg-white px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-700 border">{task.label}</span>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    <div className="space-y-3">
                      {(currentStep.options || []).map((opt, i) => (
                        <button key={i} onClick={() => handleNext(opt)} className={`option-btn w-full text-left bg-white border-2 border-slate-200 hover:border-slate-300 rounded-2xl px-5 py-4 flex items-center gap-4 shadow-sm hover:shadow-md`} style={{ borderLeftWidth: '4px', borderLeftColor: getTheme(currentStep.theme).hex }}>
                          <div className={`w-10 h-10 rounded-xl ${getTheme(currentStep.theme).light} flex items-center justify-center ${getTheme(currentStep.theme).text}`}>
                            {opt.icon === 'truck' && <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>}
                            {opt.icon === 'building2' && <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>}
                            {opt.icon === 'checkCircle' && <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>}
                            {opt.icon === 'clipboardList' && <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>}
                            {opt.icon === 'network' && <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="2" width="6" height="6"/><rect x="16" y="16" width="6" height="6"/><rect x="2" y="16" width="6" height="6"/><path d="M5 16v-4h14v4"/><path d="M12 12V8"/></svg>}
                            {opt.icon === 'package' && <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>}
                            {opt.icon === 'home' && <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>}
                            {!['truck','building2','checkCircle','clipboardList','network','package','home'].includes(opt.icon) && <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg>}
                          </div>
                          <span className="flex-1 font-bold text-slate-800">{opt.label}</span>
                          <svg className="text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="mt-8 text-center">
                  <button onClick={goHome} className="text-sm text-slate-400 hover:text-slate-600 font-semibold flex items-center gap-2 mx-auto transition-all">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                    처음부터 다시 시작
                  </button>
                </div>
              </div>
            )}
          </main>

          {showLoginModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
              <div className="glass rounded-3xl p-8 shadow-2xl w-full max-w-sm border">
                <div className="w-16 h-16 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center mx-auto mb-6"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
                <h2 className="text-xl font-bold text-center mb-6">관리자 인증</h2>
                <input type="password" autoFocus className="w-full p-4 bg-slate-100 border-0 rounded-xl mb-4 text-center text-lg font-bold outline-none focus:ring-2 focus:ring-orange-500" placeholder="암호 입력" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && login()} />
                <div className="flex gap-3">
                  <button onClick={() => setShowLoginModal(false)} className="flex-1 py-3 bg-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-300 transition-all">취소</button>
                  <button onClick={login} className="flex-1 py-3 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600 transition-all shadow-lg">로그인</button>
                </div>
              </div>
            </div>
          )}

          {/* 이미지 팝업 모달 */}
          {popupImage && (
            <div 
              className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4"
              onClick={() => setPopupImage(null)}
            >
              <div className="relative max-w-4xl max-h-[90vh] w-full flex items-center justify-center" onClick={e => e.stopPropagation()}>
                <img src={popupImage} alt="Popup" className="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl" />
                <button 
                  onClick={() => setPopupImage(null)}
                  className="absolute -top-10 right-0 md:-right-10 text-white hover:text-gray-300 p-2"
                >
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
            </div>
          )}

          <footer className="w-full py-6 text-center text-slate-400 text-xs">
            Hwamulman CSR Support System v2.0 | 정보 변경 전문 가이드
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
