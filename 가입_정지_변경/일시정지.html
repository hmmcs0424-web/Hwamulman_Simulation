<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화물맨 통합 가이드</title>
  <script src="https://cdn.tailwindcss.com/3.4.1"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            primary: { 50: '#eff8ff', 100: '#dbeefe', 200: '#bfdffd', 300: '#93c9fc', 400: '#60aaf8', 500: '#3b87f4', 600: '#2568e9', 700: '#1d53d6', 800: '#1e45ad', 900: '#1e3d89' },
            accent: { 50: '#fff7ed', 400: '#fb923c', 500: '#f97316', 600: '#ea580c' },
            success: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669' },
            danger: { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626' },
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(145deg, #f1f5f9 0%, #e2e8f0 100%); min-height: 100vh; }
    
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
    .glass-dark { background: rgba(30, 41, 59, 0.97); backdrop-filter: blur(12px); }
    
    .card-shadow { box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.08); }
    .card-hover { transition: all 0.2s ease; }
    .card-hover:hover { transform: translateX(4px); box-shadow: 0 6px 24px -6px rgba(0, 0, 0, 0.1); }
    
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    /* 편집모드 사이드바 - 컴팩트 */
    .admin-sidebar-item { 
      padding: 5px 8px; 
      font-size: 12px; 
      border-radius: 5px; 
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .admin-sidebar-item:hover { background: #f1f5f9; }
    .admin-sidebar-item.active { background: #1e40af; color: white; font-weight: 600; }
    
    .scrollbar-thin::-webkit-scrollbar { width: 5px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    /* 가이드 콘텐츠 스타일 */
    .guide-content { font-size: 0.95rem; line-height: 1.7; color: #334155; }
    .guide-content b, .guide-content strong { color: #dc2626; font-weight: 700; }
    .guide-content img { max-width: 100%; border-radius: 8px; margin: 8px 0; }
    .guide-content ul, .guide-content ol { padding-left: 1.25rem; margin: 6px 0; }
    .guide-content li { margin: 3px 0; }
    
    .breadcrumb-item::after { content: '›'; color: rgba(255,255,255,0.5); margin: 0 6px; }
    .breadcrumb-item:last-child::after { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const LucideIcon = ({ name, size = 16, className = "" }) => {
      const iconName = name.charAt(0).toLowerCase() + name.slice(1);
      const iconData = lucide.icons[iconName] || lucide.icons[name] || lucide.icons['info'];
      if (!iconData || !Array.isArray(iconData)) return <span className="inline-block" style={{width: size, height: size}} />;
      const [tag, attrs, children] = iconData;
      return React.createElement(tag, { ...attrs, width: size, height: size, className: `lucide ${className}`, stroke: "currentColor", strokeWidth: 2, fill: "none" }, children.map((child, i) => React.createElement(child[0], { ...child[1], key: i })));
    };

    const App = () => {
      const [steps, setSteps] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [viewMode, setViewMode] = useState('USER');
      const [isAdmin, setIsAdmin] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [fullViewCategory, setFullViewCategory] = useState(null); 
      
      const [currentKey, setCurrentKey] = useState('시작');
      const [history, setHistory] = useState([]);
      const [editingId, setEditingId] = useState(null);
      const [saveStatus, setSaveStatus] = useState("");
      const [tempData, setTempData] = useState({ fee: '0' });
      const [popupImage, setPopupImage] = useState(null);
      const [imageScale, setImageScale] = useState(1);

      const defaultData = [
        { id: '시작', title: '메인 메뉴', theme: 'blue', script: '<p class="text-base font-medium text-slate-700">도와드릴 상담 업무를 선택해 주세요.</p>', attachments: [], options: [{ label: '신규 가입 가이드', next: '가입_시작', icon: 'userPlus' }, { label: '정지 및 복구 가이드', next: '복구_시작', icon: 'refreshCw' }, { label: '탈퇴 안내 및 처리', next: '탈퇴_시작', icon: 'userMinus' }], type: 'menu' },
        { id: '가입_시작', title: '신규 가입', theme: 'emerald', script: '<p>화물을 등록하시는 <b>화주 가입</b>이실까요?<br/>배차를 받으시는 <b>차주님 가입</b>이실까요?</p>', attachments: [], options: [{ label: '차주 가입', next: '차주_톤수', icon: 'truck' }, { label: '화주 가입', next: '시작', icon: 'building2' }], type: 'menu' },
        { id: '차주_톤수', title: '차주 톤수 선택', theme: 'blue', script: '<p>소지하신 차량의 요금제를 선택해 주세요.</p>', attachments: [], options: [{ label: '소형 (5톤 미만) — 월 18,000원', next: '기종확인', fee: '18,000', icon: 'truck' }, { label: '중소형 (5톤~9톤) — 월 22,000원', next: '기종확인', fee: '22,000', icon: 'truck' }, { label: '중대형 (11~16톤 미만) — 월 27,500원', next: '기종확인', fee: '27,500', icon: 'truck' }, { label: '대형 (16톤 이상) — 월 55,000원', next: '기종확인', fee: '55,000', icon: 'truck' }], type: 'menu' },
        { id: '기종확인', title: '기종 확인', theme: 'blue', script: '<p>선택하신 요금제는 <b>월 {{fee}}원(선불)</b>입니다.</p><p>사용하시는 휴대폰이 안드로이드 기종이실까요?</p>', attachments: [], options: [{ label: '안드로이드', next: '서류안내', icon: 'smartphone' }, { label: '아이폰 / 기타', next: '가입불가', icon: 'smartphone' }], type: 'menu' },
        { id: '가입불가', title: '가입 불가 안내', theme: 'rose', script: '<p><b>죄송합니다. 화물맨 앱은 안드로이드 기종만 지원합니다.</b></p><p style="color:#64748b; margin-top:8px;">아이폰 사용자분께는 안드로이드 기기 준비 후 다시 연락 주시도록 안내해 주세요.</p>', attachments: [], options: [{ label: '처음으로 돌아가기', next: '시작', icon: 'home' }], type: 'end' },
        { id: '서류안내', title: '서류 안내', theme: 'emerald', script: '<p>가입에 필요한 서류를 안내드립니다.</p><ul><li>자동차 등록증</li><li>화물운송 자격증</li><li>사업자 등록증</li><li>통장 사본</li></ul><p style="margin-top:12px;"><b>문자로 서류 안내를 발송해 드릴까요?</b></p>', attachments: [], options: [{ label: '문자 발송', next: '시작', icon: 'messageSquare' }, { label: '구두 안내 완료', next: '시작', icon: 'checkCircle' }], type: 'docs' },
        { id: '복구_시작', title: '정지 복구', theme: 'orange', script: '<p>본인 확인 후 <b>가상계좌 입금 안내</b>를 도와드리겠습니다.</p><ul><li>본인 확인 필수</li><li>정지 사유 확인</li><li>미납금 금액 안내</li></ul>', attachments: [], options: [{ label: '안내 완료', next: '시작', icon: 'checkCircle' }], type: 'menu' },
        { id: '탈퇴_시작', title: '회원 탈퇴', theme: 'rose', script: '<p>탈퇴 처리 전 확인사항:</p><ul><li><b>미납금 정산</b> 완료 확인</li><li><b>진행 중 오더</b> 유무 확인</li></ul>', attachments: [], options: [{ label: '차주 탈퇴 진행', next: '탈퇴_차주', icon: 'truck' }, { label: '회원사 탈퇴 진행', next: '탈퇴_회원사', icon: 'building2' }], type: 'menu' },
        { id: '탈퇴_차주', title: '차주 탈퇴', theme: 'rose', script: '<p>미납금 완납 확인 후 탈퇴 사유를 수집해 주세요.</p><div style="margin-top:12px; padding:10px 14px; background:#fef2f2; border-left:4px solid #ef4444; border-radius:6px;"><p style="color:#dc2626; font-weight:600; font-size:0.9rem;">⚠️ 중요 고지사항</p><p style="color:#7f1d1d; margin-top:4px; font-size:0.9rem;">탈퇴 시 1년 동안 재가입이 제한될 수 있음을 반드시 안내해 주세요.</p></div>', attachments: [], options: [{ label: '안내 완료', next: '시작', icon: 'checkCircle' }], type: 'menu' },
        { id: '탈퇴_회원사', title: '회원사 탈퇴', theme: 'rose', script: '<p><b>대표자 본인 확인</b> 절차가 필수입니다.</p><div style="margin-top:12px; padding:10px 14px; background:#fef2f2; border-left:4px solid #ef4444; border-radius:6px;"><p style="color:#dc2626; font-weight:600; font-size:0.9rem;">⚠️ 중요 고지사항</p><p style="color:#7f1d1d; margin-top:4px; font-size:0.9rem;">탈퇴 즉시 모든 오더 기록이 삭제되며 복구할 수 없습니다.</p></div>', attachments: [], options: [{ label: '안내 완료', next: '시작', icon: 'checkCircle' }], type: 'menu' }
      ];

      useEffect(() => {
        if (typeof google !== 'undefined' && google.script) {
          google.script.run.withSuccessHandler((data) => {
            if (data) setSteps(JSON.parse(data));
            else setSteps(defaultData);
            setIsLoading(false);
          }).getStoredData();
        } else {
          setTimeout(() => { setSteps(defaultData); setIsLoading(false); }, 400);
        }
      }, []);

      const currentStep = useMemo(() => steps.find(s => s.id === currentKey) || steps[0] || {}, [steps, currentKey]);

      const themeConfig = {
        blue: { bg: 'bg-blue-600', light: 'bg-blue-50', text: 'text-blue-600', border: 'border-blue-400', gradient: 'from-blue-500 to-blue-700', dot: 'bg-blue-500', accent: '#3b82f6', headerBg: '#3b82f6' },
        emerald: { bg: 'bg-emerald-600', light: 'bg-emerald-50', text: 'text-emerald-600', border: 'border-emerald-400', gradient: 'from-emerald-500 to-emerald-700', dot: 'bg-emerald-500', accent: '#10b981', headerBg: '#10b981' },
        orange: { bg: 'bg-orange-500', light: 'bg-orange-50', text: 'text-orange-600', border: 'border-orange-400', gradient: 'from-orange-400 to-orange-600', dot: 'bg-orange-500', accent: '#f97316', headerBg: '#f97316' },
        rose: { bg: 'bg-rose-600', light: 'bg-rose-50', text: 'text-rose-600', border: 'border-rose-400', gradient: 'from-rose-500 to-rose-700', dot: 'bg-rose-500', accent: '#f43f5e', headerBg: '#f43f5e' },
        purple: { bg: 'bg-purple-600', light: 'bg-purple-50', text: 'text-purple-600', border: 'border-purple-400', gradient: 'from-purple-500 to-purple-700', dot: 'bg-purple-500', accent: '#9333ea', headerBg: '#9333ea' },
        indigo: { bg: 'bg-indigo-600', light: 'bg-indigo-50', text: 'text-indigo-600', border: 'border-indigo-400', gradient: 'from-indigo-500 to-indigo-700', dot: 'bg-indigo-500', accent: '#4f46e5', headerBg: '#4f46e5' },
        cyan: { bg: 'bg-cyan-600', light: 'bg-cyan-50', text: 'text-cyan-600', border: 'border-cyan-400', gradient: 'from-cyan-500 to-cyan-700', dot: 'bg-cyan-500', accent: '#0891b2', headerBg: '#0891b2' },
        teal: { bg: 'bg-teal-600', light: 'bg-teal-50', text: 'text-teal-600', border: 'border-teal-400', gradient: 'from-teal-500 to-teal-700', dot: 'bg-teal-500', accent: '#0d9488', headerBg: '#0d9488' },
        amber: { bg: 'bg-amber-500', light: 'bg-amber-50', text: 'text-amber-600', border: 'border-amber-400', gradient: 'from-amber-400 to-amber-600', dot: 'bg-amber-500', accent: '#f59e0b', headerBg: '#f59e0b' },
        slate: { bg: 'bg-slate-600', light: 'bg-slate-100', text: 'text-slate-600', border: 'border-slate-400', gradient: 'from-slate-500 to-slate-700', dot: 'bg-slate-500', accent: '#475569', headerBg: '#475569' },
      };
      const getTheme = (t) => themeConfig[t] || themeConfig.blue;

      const handleAdminToggle = () => { if (isAdmin) setViewMode(viewMode === 'USER' ? 'ADMIN' : 'USER'); else setShowLoginModal(true); };
      const login = () => { if (passwordInput === "hmm0424") { setIsAdmin(true); setViewMode('ADMIN'); setShowLoginModal(false); setPasswordInput(""); } else alert("암호가 틀립니다."); };
      const saveToCloud = () => {
        const pw = prompt("보안 암호를 입력하세요.");
        if (pw !== "hmm0424") return;
        setSaveStatus("저장 중...");
        google.script.run.withSuccessHandler(() => setSaveStatus("")).saveStoredData(JSON.stringify(steps), pw);
      };

      const handleNext = (opt) => { 
        setHistory([...history, currentKey]); 
        if (opt.fee) setTempData({...tempData, fee: opt.fee});
        setCurrentKey(opt.next); 
      };
      
      const goBack = () => { const prev = history.pop(); setHistory([...history]); setCurrentKey(prev || '시작'); };
      const goHome = () => { setHistory([]); setFullViewCategory(null); setCurrentKey('시작'); };

      const renderScript = (text) => ({ __html: (text || "").replace(/{{fee}}/g, tempData.fee || '0') });

      const getBranchFlow = (branchId, visited = new Set()) => {
        const result = [];
        if (!branchId || visited.has(branchId) || branchId === '시작') return result;
        const step = steps.find(s => s.id === branchId);
        if (step) {
          visited.add(branchId);
          result.push(step);
          if (step.options) step.options.forEach(opt => result.push(...getBranchFlow(opt.next, visited)));
        }
        return result;
      };

      const getBreadcrumb = () => {
        const crumbs = history.map(h => steps.find(s => s.id === h)?.title).filter(Boolean);
        crumbs.push(currentStep.title);
        return crumbs;
      };

      const addAttachment = () => {
        const name = prompt("첨부파일 이름:");
        if (!name) return;
        const url = prompt("파일 URL (구글 드라이브 공유 링크):");
        if (!url) return;
        setSteps(steps.map(s => s.id === editingId ? {...s, attachments: [...(s.attachments || []), { name, url }]} : s));
      };

      const removeAttachment = (idx) => {
        setSteps(steps.map(s => s.id === editingId ? {...s, attachments: (s.attachments || []).filter((_, i) => i !== idx)} : s));
      };

      // 이미지 팝업 열기
      const openImagePopup = (imageUrl) => {
        setPopupImage(imageUrl);
        setImageScale(1);
      };

      // 이미지 팝업 닫기
      const closeImagePopup = () => {
        setPopupImage(null);
        setImageScale(1);
      };

      // data-popup-image 클릭 이벤트 처리
      useEffect(() => {
        const handleClick = (e) => {
          const target = e.target.closest('[data-popup-image]');
          if (target) {
            e.preventDefault();
            const imageUrl = target.getAttribute('data-popup-image');
            if (imageUrl) {
              openImagePopup(imageUrl);
            }
          }
        };
        document.addEventListener('click', handleClick);
        return () => document.removeEventListener('click', handleClick);
      }, []);

      if (isLoading) return (
        <div className="h-screen flex items-center justify-center">
          <div className="text-center">
            <div className="w-8 h-8 border-2 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-3"></div>
            <p className="text-slate-400 text-sm">로딩 중...</p>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen">
          {/* 네비게이션 */}
          <nav className="glass-dark sticky top-0 z-50 px-4 py-2 flex justify-between items-center shadow-lg">
            <div className="flex items-center gap-2">
              <div className="w-7 h-7 bg-gradient-to-br from-blue-500 to-blue-700 rounded-lg flex items-center justify-center">
                <LucideIcon name="truck" size={14} className="text-white"/>
              </div>
              <div>
                <h1 className="font-bold text-white text-sm">화물맨 CSR 가이드</h1>
                <p className="text-slate-400 text-[10px]">Decision Tree Navigator</p>
              </div>
            </div>
            <div className="flex gap-2 items-center">
              {isAdmin && viewMode === 'ADMIN' && (
                <button onClick={saveToCloud} className="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1">
                  <LucideIcon name="save" size={12}/> {saveStatus || "저장"}
                </button>
              )}
              <button onClick={handleAdminToggle} className={`px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1 ${viewMode === 'ADMIN' ? 'bg-orange-500 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                <LucideIcon name={viewMode === 'USER' ? 'settings' : 'eye'} size={12}/>
                {viewMode === 'USER' ? '편집' : '상담'}
              </button>
            </div>
          </nav>

          <main className="max-w-7xl p-3 lg:p-4">
            {viewMode === 'ADMIN' ? (
              /* === 편집 모드 === */
              <div className="flex gap-3 h-[calc(100vh-70px)]">
                <div className="w-64 glass rounded-xl p-2 overflow-y-auto scrollbar-thin card-shadow flex-shrink-0">
                  <button onClick={() => {
                      const newId = `S_${Date.now()}`;
                      setSteps([{ id: newId, title: '새 단계', theme: 'blue', script: '', attachments: [], options: [] }, ...steps]);
                      setEditingId(newId);
                  }} className="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-medium text-xs mb-2 flex items-center justify-center gap-1 transition-all">
                    <LucideIcon name="plus" size={12}/> ADD NEW
                  </button>
                  <div className="space-y-0.5">
                    {steps.map((s, index) => (
                      <div 
                        key={s.id} 
                        draggable
                        onDragStart={(e) => {
                          e.dataTransfer.setData('dragIndex', index.toString());
                          e.currentTarget.classList.add('opacity-50');
                        }}
                        onDragEnd={(e) => {
                          e.currentTarget.classList.remove('opacity-50');
                        }}
                        onDragOver={(e) => {
                          e.preventDefault();
                          e.currentTarget.classList.add('border-t-2', 'border-blue-500');
                        }}
                        onDragLeave={(e) => {
                          e.currentTarget.classList.remove('border-t-2', 'border-blue-500');
                        }}
                        onDrop={(e) => {
                          e.preventDefault();
                          e.currentTarget.classList.remove('border-t-2', 'border-blue-500');
                          const dragIndex = parseInt(e.dataTransfer.getData('dragIndex'));
                          const dropIndex = index;
                          if (dragIndex !== dropIndex) {
                            const newSteps = [...steps];
                            const [draggedItem] = newSteps.splice(dragIndex, 1);
                            newSteps.splice(dropIndex, 0, draggedItem);
                            setSteps(newSteps);
                          }
                        }}
                        className={`admin-sidebar-item ${editingId === s.id ? 'active' : 'text-slate-600'} cursor-grab active:cursor-grabbing group`}
                      >
                        <div onClick={() => setEditingId(s.id)} className="flex items-center gap-1.5 flex-1 min-w-0">
                          <LucideIcon name="gripVertical" size={12} className="text-slate-400 flex-shrink-0"/>
                          <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${getTheme(s.theme).dot}`}></span>
                          <span className="truncate flex-1">{s.title || s.id}</span>
                        </div>
                        <button

                                  type: file.type,
                                  isBase64: true

                                setSteps(steps.map(s => s.id === editingId ? {...s, attachments: [...(s.attachments || []), newAttachment]} : s));

                                  url: base64,
                                  type: file.type,
                                  isBase64: true

                    onClick={() => setImageScale(1.5)}

              </div>
            </div>

      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
